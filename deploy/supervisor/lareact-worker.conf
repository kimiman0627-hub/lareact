; lareact 큐 워커 (server-setup.sh 가 __PLACEHOLDER__ 를 치환해서 설치)
; 배포 시 `php artisan queue:restart` 로 워커가 종료되면 supervisor 가 새 코드로 재기동함
[program:lareact-worker]
process_name=%(program_name)s_%(process_num)02d
command=php __APP_DIR__/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=__APP_DIR__
user=__APP_USER__
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
