# lareact Nginx 사이트 설정 (server-setup.sh 가 __PLACEHOLDER__ 를 치환해서 설치)

# Cloudflare Tunnel 등 HTTPS 프록시 뒤에 있을 때 Laravel 이 https 로 인식하도록
map $http_x_forwarded_proto $lareact_https {
    default "";
    https   on;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __APP_DIR__/public;
    index index.php;

    charset utf-8;
    client_max_body_size 55M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Cloudflare Tunnel / 프록시 뒤에서 실제 접속자 IP 사용
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 127.0.0.1;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite 빌드 결과물 (파일명에 해시 포함 → 장기 캐시)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 크롤링 이미지 등 업로드 파일
    location /storage/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $lareact_https if_not_empty;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
