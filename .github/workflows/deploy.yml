name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: lareact_test
          POSTGRES_USER: kim
          POSTGRES_PASSWORD: secret
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, mbstring, xml, ctype, fileinfo, openssl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4.2.3
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lareact_test
          DB_USERNAME: kim
          DB_PASSWORD: secret

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lareact_test
          DB_USERNAME: kim
          DB_PASSWORD: secret

  deploy:
    name: Deploy to Production
    # 미니PC 에 'minipc' 라벨로 등록한 러너에서만 실행 (deploy/install-runner.sh)
    runs-on: [self-hosted, minipc]
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy
        run: |
          set -e
          cd /home/kim/www/lareact

          # 실패하더라도 점검 모드는 반드시 해제
          trap 'php artisan up || true' EXIT

          echo "==> 점검 모드"
          php artisan down --retry=15 --refresh=15 || true

          echo "==> git pull"
          git pull --ff-only origin main

          echo "==> Composer install"
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

          echo "==> npm install & build"
          npm ci
          npm run build

          echo "==> Artisan"
          php artisan migrate --force
          php artisan storage:link || true
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          php artisan cache:clear

          echo "==> 큐 워커 재시작 (supervisor 가 새 코드로 다시 띄움)"
          php artisan queue:restart

          echo "==> Done"
